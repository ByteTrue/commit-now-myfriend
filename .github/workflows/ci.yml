name: CI

on:
  push:
  pull_request:

jobs:
  validate-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go fmt check
        run: |
          gofmt -w cmd internal
          git diff --exit-code

      - name: Test suite
        run: npm test

      - name: Go build
        run: make go-build

      - name: npm pack dry run
        run: npm pack --dry-run
